[project]
name = "icp-api"
version = "0.1.0"
description = "Control plane API for vLLM deployments on Kubernetes and Slurm"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "kubernetes>=31.0",
  "asyncssh>=2.17",
  "jinja2>=3.1",
  "prometheus-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icp_api"]
