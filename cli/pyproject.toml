[project]
name = "icp-cli"
version = "0.1.0"
description = "Command-line client for the inference control plane"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "httpx>=0.27", "rich>=13"]

[project.scripts]
icp = "icp_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icp_cli"]
