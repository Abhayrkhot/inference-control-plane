# The control plane may manage Deployments and Services, and read pods and their logs,
# in icp-models only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: icp-api
  namespace: icp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: icp-api
  namespace: icp-models
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: icp-api
  namespace: icp-models
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: icp-api
subjects:
  - kind: ServiceAccount
    name: icp-api
    namespace: icp-system
