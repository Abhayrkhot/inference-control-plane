[project]
name = "fake-vllm"
version = "0.1.0"
description = "Stand-in for vLLM's OpenAI server: same endpoints and metric names, no GPU"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "prometheus-client>=0.21"]

[project.scripts]
# Named `vllm` so the same Kubernetes manifest (`vllm serve MODEL ...`) runs either image.
vllm = "fake_vllm.cli:main"
fake-vllm = "fake_vllm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fake_vllm"]
